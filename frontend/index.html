      <div class="workspace">

                />
              </svg>
            </span>
            <span class="side-brand__text">
              <b>ROSMASTER RESCUE</b>
              <small>X3 救援机器人控制台</small>
            </span>
            <!-- 站点名：是 logo 的一部分，紧贴标识正下方、水平居中。
                 字号 / 字距 / 颜色都在 .side-brand__name 上，直接改那里即可。 -->
            <span class="side-brand__name">ROSMASTER X3</span>
          </a>

          <!-- 电量只在收起的竖排条里出现（上：电池图形，下：百分比）；
               展开时电量在下方机型卡片的第一行，这里整块隐藏。 -->
          <div class="side-status">
            <span
              class="battery-ind"
              id="battery-ind"
              role="meter"
              aria-label="机器人电量"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuetext="等待机器人遥测"
            >
              <span class="battery-ind__icon" aria-hidden="true">
                <svg viewBox="42.667 256 938.667 512" focusable="false">
                  <path
                    d="M938.666667 426.666667l0-85.333333c0-46.933333-38.4-85.333333-85.333333-85.333333L128 256c-46.933333 0-85.333333 38.4-85.333333 85.333333l0 341.333333c0 46.933333 38.4 85.333333 85.333333 85.333333l725.333333 0c46.933333 0 85.333333-38.4 85.333333-85.333333l0-85.333333c23.466667 0 42.666667-19.2 42.666667-42.666667l0-85.333333C981.333333 445.866667 962.133333 426.666667 938.666667 426.666667zM896 682.666667c0 23.466667-19.2 42.666667-42.666667 42.666667L128 725.333333c-23.466667 0-42.666667-19.2-42.666667-42.666667L85.333333 341.333333c0-23.466667 19.2-42.666667 42.666667-42.666667l725.333333 0c23.466667 0 42.666667 19.2 42.666667 42.666667L896 682.666667zM128 682.666667l384 0L512 341.333333 128 341.333333 128 682.666667z"
                  />
                </svg>
              </span>
              <b class="battery-ind__num" id="battery-tip">—</b>
            </span>
          </div>

          <!-- logo 区与菜单按钮之间的一条浅色分界线 -->
          <div class="side-divider" aria-hidden="true"></div>

          <nav class="left-nav" id="left-nav" aria-label="主导航"></nav>

          <div class="nav-foot">
            <button
              class="nav-toggle"
              id="side-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="left-nav"
              aria-label="收起导航"
            >
              <span class="nav-toggle__chev" aria-hidden="true"
                ><svg viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6" /></svg
              ></span>
            </button>
          </div>

          <a
            class="unit-card"
            id="unit-card"
            href="#/machine"
            data-tip="机器信息"
            aria-label="ROSMASTER X3 实机与实时状态，点击进入机器信息"
          >
            <span class="unit-card__media">
              <img src="assets/rosmaster-x3.jpg" alt="ROSMASTER X3 实机" />
            </span>
            <span class="unit-card__head">
              <span class="unit-card__name">ROSMASTER X3</span>
              <span class="chev" aria-hidden="true"
                ><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg
              ></span>
            </span>
            <span class="unit-card__data" id="unit-card-data"></span>
          </a>
        </aside>

        <button
          class="drawer-btn"
          id="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="left-nav"
          aria-label="展开导航"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>

        <main class="view" id="view" tabindex="-1"></main>
      </div>
    </div>

    <div class="scrim" id="scrim" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
